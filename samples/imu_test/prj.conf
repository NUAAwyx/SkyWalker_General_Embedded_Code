# 让 module 里的 drivers / libs 参与编译
CONFIG_SKYWALKER_DRIVER_IMU=y
CONFIG_SKYWALKER_DRIVER_KALMAN_FILTER=y
CONFIG_SKYWALKER_DRIVER_PID=y
CONFIG_SKYWALKER_LIB_MATRIX=y
CONFIG_SKYWALKER_LIB_VOFA=y
CONFIG_UART_ASYNC_API=y
CONFIG_NOCACHE_MEMORY=y

# ─── 硬件浮点 ───
# Cortex-M7 的 fpv5 单精度 FPU。打开后 a*b+c 从两次库调用
# （__aeabi_fmul + __aeabi_fadd）变成一条 vfma.f32。
#
# 这一条会连带打开：
#   CONFIG_FP_HARDABI — 浮点 ABI（arch/arm/core/Kconfig:317 的 choice 默认项）
#   CONFIG_FPU_SHARING — 多线程共享 FP 寄存器（被 FP_HARDABI select）
#
# 实测代价（dm_mc02/stm32h723xx，A/B 构建，符号级 diff）：
#   FLASH  83412 → 86360  = +2948 B (+3.5%)
#   RAM    21664 → 22880  = +1216 B (+5.6%)
#
# ⚠️ 连带要求（见 NOTES.md）：
#   1. 所有可能碰浮点的线程必须打 K_FP_REGS 标记，
#      否则 MPU 栈保护区算不准，溢出可能检测不到
#      （thread.c:238 z_arm_mpu_stack_guard_and_fpu_adjust）
#   2. 这些线程的栈各加 128 字节
#   3. ISR 里不能做浮点运算（float.rst:16）—— 已知隐患：vofa.c 的 parse_float
#
# ⚠️ 三条非预期的连带效应（都是 Kconfig 默认值链式引发的，不是 bug）：
#   a) lib/os/Kconfig.cbprintf:68  default y if FPU
#      → CONFIG_CBPRINTF_FP_SUPPORT=y
#      → picolibc/Kconfig:47 让 PICOLIBC_IO_LONG_LONG 变得不可选
#      → printf 档位掉到 PICOLIBC_IO_FLOAT
#      → 链进整个双精度格式化引擎（__dtoa_engine / __d_vfprintf /
#        DOUBLE_POW5_TABLE …）—— FLASH 增量几乎全在这里
#      → 若不需要 printf 打浮点：CONFIG_CBPRINTF_FP_SUPPORT=n 手动关掉
#   b) ARM_MPU_REGION_MIN_ALIGN_AND_SIZE 32 → 128，MPU_STACK_GUARD_MIN_SIZE_FLOAT=128
#      → 每个线程栈的静态保留区 64 → 128，即【每个栈 +64 B】
#   c) struct k_thread 里的 struct _preempt_float（s16~s31，16×4=64 B）
#      → 【每个线程对象 +64 B】
#   b+c 合计 +1224 B，与实测吻合。
CONFIG_FPU=y

# ─── BMI08x 数据就绪中断 ───
# 默认是 BMI08X_ACCEL_TRIGGER_NONE —— 此时 bmi08x_accel_trigger.c【根本不参与编译】，
# 驱动 api->trigger_set == NULL，sensor_trigger_set() 返回 -ENOSYS，
# 而编译、启动全都不报错。这就是本项目的"静默死亡"坑。
#
# OWN_THREAD = 驱动自己起一个线程跑回调（默认优先级 10，低于估计线程的 8）。
# 选 OWN_THREAD 而不是 GLOBAL_THREAD：GLOBAL_THREAD 会把回调塞进
# 系统的 sysworkq（优先级 -1，比所有应用线程都高），串行排队，
# 不适合高频、固定节拍的数据流。
CONFIG_BMI08X_ACCEL_TRIGGER_OWN_THREAD=y

# ─── 双速率：陀螺仪也挂中断 ───
# accel-hz = 800、gyro-hz = 1000_116（见 dm_mc02.dts:146,159）。
# 只接加速度计中断的话，陀螺仪会被按 800 Hz 顺带读取 → 每秒丢 200 个样本。
# 接上陀螺仪中断后：predict 挂 1000 Hz、correct 挂 800 Hz，各回各的节拍。
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y

# ─── 事件对象 ───
# 两个中断源之后，线程需要知道"这次是谁叫醒我的"。
# k_sem 只有"有/没有"一个位，【不携带身份】，所以换成 k_event（32 位掩码）。
# 注意本板默认是关的（kernel/Kconfig:629），必须显式打开。
CONFIG_EVENTS=y
