# ── skywalker 最终固件 ──
#
# ⚠️ 这里的开关是「这辆车用到了哪些【子系统】」，不是「用了哪个【型号】」。
#    所以电机两个驱动都开：没有对应 DT 节点的那个不会实例化任何设备。
#    型号完全由 application/boards/dm_mc02.overlay 决定 ——
#    和上层代码里不出现型号名是同一条规则。
#
# ⚠️ 但「不开设备」不等于「零代价」：本 overlay 全是 motor_dji，所以
#    motor_dm 那边 DT_INST_FOREACH_STATUS_OKAY 展开为空，会留下
#    -Wunused-function / -Wunused-const-variable 告警（api / init / 三个命令帧）。
#    这是【预期】的，不是坏了 —— 见 dt-macros-need-a-node-to-expand 那条笔记。
#    哪天换成达妙电机，告警会整体挪到 motor_dji 那边去。
#
# ⚠️ 干净构建时还会看到两条 CMake Warning「No SOURCES given to Zephyr library」：
#      ..__skywalker_code__lib__matrix —— matrix.c 只在 _MATRIX_STORAGE 下编译
#         （那是矩阵存 flash 的功能，本车不用）。CONFIG_SKYWALKER_LIB_MATRIX 的
#         真正作用是 select CMSIS_DSP / CMSIS_DSP_MATRIX —— EKF 要的
#         arm_matrix_instance_f32 和 Matrix_Init 都在 CMSIS-DSP 里，所以这个开关
#         【必须留】。库目标为空是设计如此。
#      drivers__counter —— Zephyr 自己的，被某个依赖勾上但本板没有 counter 驱动。
#    两条都无害，不用管。

# ── skywalker 自己的驱动 / 库 ──
CONFIG_SKYWALKER_DRIVER_MOTOR=y
CONFIG_SKYWALKER_DRIVER_MOTOR_DJI=y
CONFIG_SKYWALKER_DRIVER_MOTOR_DM=y
CONFIG_SKYWALKER_DRIVER_PID=y
CONFIG_SKYWALKER_DRIVER_IMU=y
CONFIG_SKYWALKER_DRIVER_KALMAN_FILTER=y
CONFIG_SKYWALKER_DRIVER_CHASSIS=y
CONFIG_SKYWALKER_DRIVER_GIMBAL=y
CONFIG_SKYWALKER_LIB_DR16=y
CONFIG_SKYWALKER_LIB_MATRIX=y
CONFIG_SKYWALKER_LIB_VOFA=y

# ── 外设 ──
CONFIG_CAN=y
CONFIG_UART_ASYNC_API=y
CONFIG_EVENTS=y

# ── IMU（Bosch BMI08x，挂在 spi2 上，节点在板级 dts 里）──
# OWN_THREAD：传感器的 INT 引脚回调不能直接做解算，交给自己那条线程。
CONFIG_BMI08X_ACCEL_TRIGGER_OWN_THREAD=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y

# ── 浮点 ──
# FPU_SHARING 必须开：中断里也可能碰到浮点（CAN 反馈换算），不开的话
# FPU 寄存器不会被保存/恢复，任务切换后浮点结果随机错。
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# DR16 的 DMA 接收缓冲要求落在 nocache 段，见 lib/dr16/dr16.c
CONFIG_NOCACHE_MEMORY=y
